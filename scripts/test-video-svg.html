<!doctype html><html lang="en"><meta charset="utf-8"><title>SVG rendering checks</title>
<style>@font-face{font-family:'Focal Upright';src:url('../Focal-Upright-VF_wght.ttf');font-weight:100 900}body{background:#222;color:white;font:16px 'Focal Upright';margin:24px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}canvas,img{width:100%}h2{grid-column:span 2}</style><h1>Canvas / SVG</h1><nav><a href="?format=wide">Landscape</a> · <a href="?format=portrait">Portrait</a> · <a href="?format=square">Square</a></nav><a href="?treatment=background">Headline backgrounds</a><p id="status">Checking…</p><main></main>
<script type="module">
import {createScene,renderScene,LAYOUTS,FORMATS} from '../video-core.mjs?v=22';
import {createSvgContext} from '../video-svg.mjs?v=22';
await document.fonts.load('500 48px "Focal Upright"');await document.fonts.load('400 48px "Focal Upright"');
const bytes=new Uint8Array(await (await fetch('../Focal-Upright-VF_wght.ttf')).arrayBuffer());
let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);
const fontData='data:font/ttf;base64,'+btoa(binary);
const results=[];
// Include a placed raster asset to exercise clipped image embedding.
const media=document.createElement('canvas');media.width=200;media.height=120;const mc=media.getContext('2d');mc.fillStyle='#115ef3';mc.fillRect(0,0,200,120);mc.fillStyle='#99edff';mc.fillRect(10,10,70,100);
const mediaImage=new Image();mediaImage.src=media.toDataURL();await mediaImage.decode();
for(const [layout,label] of LAYOUTS){
 const [w,h]=FORMATS[new URLSearchParams(location.search).get('format')||'wide'],canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');
 const scene=createScene({layout,treatment:new URLSearchParams(location.search).get('treatment')||'solid',title:'A study in motion.',body:'Make it move.',animation:'none',promptReveal:false,pattern:'dust'});
 const asset={element:mediaImage};
 renderScene(ctx,scene,2,w,h,asset);
 const recorder=createSvgContext(w,h,document.createElement('canvas').getContext('2d'));renderScene(recorder.context,scene,2,w,h,asset);
 const svg=recorder.serialize(label,fontData), parsed=new DOMParser().parseFromString(svg,'image/svg+xml');
 const image=new Image();image.src=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));await image.decode();
 const raster=document.createElement('canvas');raster.width=w;raster.height=h;const rc=raster.getContext('2d');rc.drawImage(image,0,0);
 const a=ctx.getImageData(0,0,w,h).data,b=rc.getImageData(0,0,w,h).data;let difference=0;for(let i=0;i<a.length;i+=4)difference+=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);
 const error=difference/(w*h*3*255);const valid=!parsed.querySelector('parsererror')&&parsed.querySelectorAll('text').length>0&&error<.012;
 results.push(`${layout}: ${valid?'PASS':'FAIL'} (${(error*100).toFixed(3)}% difference)`);
 if(['hero','waffle','line-chart','goal-blocks','frame'].includes(layout)){const section=document.createElement('section'),heading=document.createElement('h2');heading.textContent=label;section.append(heading,canvas,image);document.querySelector('main').append(section);}
}
document.getElementById('status').textContent=results.join(' · ');
</script></html>
