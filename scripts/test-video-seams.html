<!doctype html><html lang="en"><meta charset="utf-8"><title>Diffusion seam checks</title>
<style>body{font:16px sans-serif;background:#222;color:#fff;margin:24px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}canvas{width:100%}h2{font-size:16px}</style><h1>Overlapping square edges</h1><p id="result">Checking…</p><main></main>
<script type="module">
import {createScene,renderScene} from '../video-core.mjs?v=14';
import {diffusionNodes} from '../video-diffusion.mjs?v=14';
const scene=createScene({title:'',body:'',pattern:'dust',opacity:100,bg:'#ffffff',colors:['#115ef3','#c5e9ff','#ffffff'],primitive:'squares',scale:53,shapeMin:100,shapeMax:100,megaRarity:50,megaTiers:[2,3,4],density:100,maxNodes:2000,fadeDirection:'none',sweepDepth:0,waveRipples:0,clearPattern:false,clearGraphics:false});
const palette=new Set(['255,255,255','17,94,243','197,233,255']);
const results=[];
for(const ratio of [1,1.5,.225]){
 const samples=[];
 for(const fixed of [false,true]){
  const canvas=document.createElement('canvas');canvas.width=Math.round(1280*ratio);canvas.height=Math.round(720*ratio);
  const ctx=canvas.getContext('2d');ctx.scale(canvas.width/1280,canvas.height/720);
  if(fixed)renderScene(ctx,scene,2,1280,720,null);
  else {ctx.fillStyle=scene.bg;ctx.fillRect(0,0,1280,720);for(const n of diffusionNodes(scene,2,1280,720)){ctx.fillStyle=scene.colors[n.color];ctx.fillRect(n.x-n.size/2,n.y-n.size/2,n.size,n.size);}}
  const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;let mixed=0;
  for(let i=0;i<pixels.length;i+=4)if(!palette.has(`${pixels[i]},${pixels[i+1]},${pixels[i+2]}`))mixed++;
  samples.push(mixed);
  if(ratio===1){const section=document.createElement('section'),label=document.createElement('h2');label.textContent=fixed?'Fixed — same nodes and sizes':'Before';section.append(label,canvas);document.querySelector('main').append(section);}
 }
 results.push(`${ratio}×: ${samples[0]>0&&samples[1]===0?'PASS':'FAIL'} (${samples[0]} → ${samples[1]} seam pixels)`);
}
document.getElementById('result').textContent=results.join(' · ');
</script></html>
