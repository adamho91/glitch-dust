<!doctype html><html lang="en"><meta charset="utf-8"><title>Media aspect ratio checks</title>
<style>body{background:#222;color:#eee;font:16px system-ui;margin:24px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}h2{grid-column:span 2}canvas,img{width:100%}</style>
<h1>Media frame / SVG</h1><p id="status">Checking…</p><main></main>
<script type="module">
import {createScene,renderScene} from '../video-core.mjs?v=24';
import {createSvgContext} from '../video-svg.mjs?v=24';
const results=[];
for(const orientation of ['landscape','portrait']) {
 const source=document.createElement('canvas');source.width=orientation==='landscape'?400:200;source.height=orientation==='landscape'?200:400;
 const sc=source.getContext('2d');sc.fillStyle='#115ef3';sc.fillRect(0,0,source.width,source.height);sc.fillStyle='#99edff';sc.fillRect(source.width*.2,source.height*.2,source.width*.6,source.height*.6);
 const element=new Image();element.src=source.toDataURL();await element.decode();
 for(const mode of ['contain','adapt','cover']) for(const zoom of [100,150]) {
  const canvas=document.createElement('canvas');canvas.width=720;canvas.height=720;const ctx=canvas.getContext('2d');
  const scene=createScene({layout:'frame',mediaId:'test',mediaFit:mode,mediaZoom:zoom,mediaDim:40,bg:'#ffffff',pattern:'none',title:'',body:'',eyebrow:''});
  renderScene(ctx,scene,2,720,720,{element});
  const recorder=createSvgContext(720,720,document.createElement('canvas').getContext('2d'));renderScene(recorder.context,scene,2,720,720,{element});
  const svgImage=new Image();const url=URL.createObjectURL(new Blob([recorder.serialize()],{type:'image/svg+xml'}));svgImage.src=url;await svgImage.decode();
  const raster=document.createElement('canvas');raster.width=720;raster.height=720;const rc=raster.getContext('2d');rc.drawImage(svgImage,0,0);
  const a=ctx.getImageData(0,0,720,720).data,b=rc.getImageData(0,0,720,720).data;let diff=0;for(let i=0;i<a.length;i++)diff+=Math.abs(a[i]-b[i]);
  const margin=ctx.getImageData(60,60,1,1).data;
  const clean=mode==='cover'||margin[0]===255&&margin[1]===255&&margin[2]===255;
  const parity=diff/(a.length*255)<.002;
  results.push(`${orientation} ${mode} ${zoom}%: ${clean&&parity?'PASS':'FAIL'}`);
  if(zoom===100){const section=document.createElement('section'),h=document.createElement('h2');h.textContent=`${orientation} · ${mode} · Canvas / SVG`;section.append(h,canvas,svgImage);document.querySelector('main').append(section);}
 }
}
document.getElementById('status').textContent=results.join(' · ');
</script></html>
